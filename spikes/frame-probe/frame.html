<!doctype html><meta charset=utf-8><title>Sitebound frame probe</title>
<body style="font:15px system-ui;padding:12px">
<b>Sitebound frame</b> (origin <span id=o></span>)<br>
Site: <b id=site></b> · Amount: <b id=amt></b> USDT<br><br>
<button id=c>1. Create passkey</button> <button id=g>2. Pay with Touch ID</button>
<p id=topnote style="color:#a60"></p>
<pre id=out style="white-space:pre-wrap;font-size:12px"></pre>
<script>
const $=id=>document.getElementById(id), out=t=>$('out').textContent=t;
$('o').textContent=location.origin;
$('site').textContent=document.referrer?new URL(document.referrer).origin:'(top-level)';
$('amt').textContent=new URLSearchParams(location.search).get('amount')||'—';
const inFrame=window.top!==window.self;
if(!inFrame)$('topnote').textContent='Top-level mode: create the passkey here if it failed inside the iframe.';
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>Uint8Array.from(h.replace(/^0x/,'').match(/../g),x=>parseInt(x,16));
const log=o=>fetch('/log',{method:'POST',body:JSON.stringify({...o,inFrame,ua:navigator.userAgent,t:new Date().toISOString()})});
// DER ECDSA signature -> 32-byte r and s
const rs=d=>{d=new Uint8Array(d);let i=3,out=[];for(let k=0;k<2;k++){let n=d[i],v=d.slice(i+1,i+1+n);while(v.length>32)v=v.slice(1);const p=new Uint8Array(32);p.set(v,32-v.length);out.push(hex(p));i+=n+2}return out};
$('c').onclick=async()=>{try{const a=await navigator.credentials.create({publicKey:{rp:{id:'localhost',name:'Sitebound probe'},user:{id:rnd(16),name:'probe',displayName:'probe'},challenge:rnd(32),pubKeyCredParams:[{type:'public-key',alg:-7}],authenticatorSelection:{residentKey:'required',userVerification:'required'}}});const spki=new Uint8Array(a.response.getPublicKey());const xy=hex(spki.slice(-64));out('create OK\ncredId '+hex(a.rawId));log({step:'create',ok:true,credId:hex(a.rawId),pubX:xy.slice(0,64),pubY:xy.slice(64),spki:hex(spki)})}catch(e){out('create FAILED: '+e.name+' '+e.message);log({step:'create',ok:false,err:e.name+': '+e.message})}};
$('g').onclick=async()=>{try{const p=await (await fetch('/challenge.json')).json();const a=await navigator.credentials.get({publicKey:{rpId:'localhost',challenge:unhex(p.challenge),userVerification:'required',allowCredentials:[{type:'public-key',id:unhex(p.credId)}]}});const r=a.response,cd=new TextDecoder().decode(r.clientDataJSON),[sr,ss]=rs(r.signature);out(cd);log({step:'get',ok:true,credId:hex(a.rawId),challenge:p.challenge,authenticatorData:hex(r.authenticatorData),clientDataJSON:cd,signatureDer:hex(r.signature),r:sr,s:ss})}catch(e){out('get FAILED: '+e.name+' '+e.message);log({step:'get',ok:false,err:e.name+': '+e.message})}};
</script>

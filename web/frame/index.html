<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Sitebound checkout</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="frame.css">
  <script src="../config.js"></script>
  <script src="../vendor/ethers-6.17.0.umd.min.js"></script>
  <script type="module" src="frame.js"></script>
</head>
<body>
  <main class="card">
    <header class="head">
      <span class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="8" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="5"/></svg>
        Sitebound
      </span>
      <button id="close" class="x" type="button" aria-label="Close">&times;</button>
    </header>

    <section class="site" aria-label="Website you are paying">
      <h1 id="line" class="siteline"><span class="sr-only">Pay <span id="line-amount"></span> USDT to </span><span class="k" aria-hidden="true">You are paying this website</span><b id="site"></b></h1>
    </section>

    <section id="checkout">
      <p class="amount"><span id="amount">&mdash;</span> <small>USDT</small></p>
      <p id="order" class="meta"></p>
    </section>

    <p id="warn" class="warn" role="note" hidden></p>

    <div id="actions" class="stack">
      <button id="pay" class="btn" type="button">Pay with Touch ID</button>
      <p id="fee" class="fee"></p>
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
      <button id="continue" class="btn" type="button" hidden>Continue in wallet window</button>
      <div class="alt">
        <button id="pay-wallet" class="ghost" type="button">Pay from my wallet instead</button>
        <p class="note">No network fee. Your wallet pays gas in WBT.</p>
      </div>
      <p id="first" class="first"><b>First time here?</b> Set up once: connect your wallet, choose a spending limit, confirm with Touch ID. <a id="setup" class="link" href="setup.html" target="_blank" rel="opener">Set up</a></p>
    </div>

    <section id="receipt" class="stack" hidden aria-live="polite">
      <h2 class="title ok">Paid</h2>
      <dl class="rows">
        <div><dt>Amount</dt><dd id="r-amount"></dd></div>
        <div><dt>Website</dt><dd id="r-site"></dd></div>
        <div><dt>Order</dt><dd id="r-order"></dd></div>
        <div><dt>Receipt</dt><dd><a id="r-receipt" class="link" target="_blank" rel="noopener">Open receipt</a></dd></div>
        <div><dt>Transaction</dt><dd><a id="r-tx" class="link mono" target="_blank" rel="noopener"></a></dd></div>
      </dl>
      <button id="done" class="btn" type="button">Close</button>
    </section>
  </main>
</body>
</html>
